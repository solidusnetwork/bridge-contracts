# Solidus Bridge EVM contracts.
#
# ⚠ `fs_permissions` IS THE ONE THAT FAILS QUIETLY. A `vm.readFile` outside an allowed path reverts
# inside the cheatcode, so the test that wanted the vector reads as a decoding bug rather than as a
# permission. `test/Toolchain.t.sol` asserts the read once, here, so no later test has to wonder.
[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["node_modules"]
solc = "0.8.28"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"
fs_permissions = [
  { access = "read", path = "./test-fixtures" },
  { access = "read-write", path = "./deployments" },
]
